<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#ffe6ec;font-family:sans-serif;padding:15px}.card{background:white;padding:15px;border-radius:12px;margin-top:12px}input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}button{width:100%;padding:12px;background:#ff4081;color:white;border:none;border-radius:10px;font-weight:bold}</style></head><body><h2>💕 Nuestra Bitácora</h2><a href="/salir">Salir</a><hr><form method="POST" action="/guardar" enctype="multipart/form-data"><input name="pareja" placeholder="Nombre de la pareja" required><textarea name="actividad" placeholder="Que hicieron hoy?" required></textarea><input name="musica" placeholder="Link YouTube opcional"><input type="file" name="foto" accept="image/*"><button type="submit">Guardar recuerdo</button></form><hr>{% for p in posts %}<div class="card"><b>{{p['pareja']}}</b> - {{p['fecha']}}<br>{{p['actividad']}}<br>{% if p['foto'] %}<img src="/uploads/{{p['foto']}}" style="width:100%;border-radius:10px;margin-top:10px">{% endif %}{% if p['musica'] %}<br><iframe width="100%" height="200" src="{{p['musica']}}" frameborder="0" allowfullscreen></iframe>{% endif %}</div>{% endfor %}</body></html>
